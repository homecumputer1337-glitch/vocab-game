const shuffle = a => { for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

function entry(en, loose){                      // loose = also match plurals / the last word (for emoji only)
  const k = en.trim().toLowerCase().replace(/\s+/g,"_");
  const c = [k, k.replace(/ies$/,"y"), k.replace(/es$/,""), k.replace(/s$/,"")];
  if(loose) c.push(k.split("_").pop());
  for(const x of c) if(DB[x]) return DB[x];
  return null;
}

/* ---------- automatic Arabic translation: built-in list -> Google -> Lingva -> MyMemory ---------- */
async function getJSON(url){
  const c = new AbortController(), t = setTimeout(() => c.abort(), 7000);
  try{ const r = await fetch(url, {signal:c.signal}); if(!r.ok) throw new Error(r.status); return await r.json(); } finally{ clearTimeout(t); }
}
let trWhy = "", blockedNet = false;
document.addEventListener("securitypolicyviolation", e => { if(/connect-src|default-src/.test(e.violatedDirective)) blockedNet = true; });
async function translate(en){
  const q = en.trim(), e = entry(q, false); trWhy = ""; if(e) return e.ar;
  const tries = [
    ["Google", async () => (await getJSON("https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ar&dt=t&q=" + encodeURIComponent(q)))[0].map(x => x[0]).join("").trim()],
    ["Lingva", async () => ((await getJSON("https://lingva.ml/api/v1/en/ar/" + encodeURIComponent(q))).translation || "").trim()],
    ["MyMemory", async () => { const t = ((await getJSON("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(q) + "&langpair=en|ar")).responseData || {}).translatedText || "";
                  return /MYMEMORY|QUERY LENGTH|INVALID/i.test(t) ? "" : t.trim(); }]
  ];
  for(const [name, f] of tries){
    try{ const t = await f(); if(t) return t; trWhy += name + ": no answer. "; }
    catch(err){ trWhy += name + ": " + (err.name === "AbortError" ? "too slow" : "could not connect") + ". "; }
  }
  if(blockedNet) trWhy = "This window blocks internet access, so online translation cannot work here. Save the file and open it in Chrome, Edge, Firefox or Safari. ";
  return "";
}

/* ---------- sounds: a "whoosh" for a right answer, a soft "bonk" for a wrong one ---------- */
let AC;
/* sounds: "good" = happy chime + sparkles, "win" = big fanfare + whoosh + applause, "bad" = soft bonk */
function sfx(kind){
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if(AC.state === "suspended") AC.resume();
    const t0 = AC.currentTime, out = AC.destination;
    const tone = (f, at, dur, type = "sine", vol = .25) => {
      const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t0+at); g.gain.exponentialRampToValueAtTime(vol, t0+at+.02); g.gain.exponentialRampToValueAtTime(.0001, t0+at+dur);
      o.connect(g); g.connect(out); o.start(t0+at); o.stop(t0+at+dur+.05);
    };
    const noise = (secs) => { const n = Math.floor(AC.sampleRate*secs), buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
      for(let i=0;i<n;i++) d[i] = Math.random()*2 - 1; const s = AC.createBufferSource(); s.buffer = buf; return s; };
    const sparkle = (at, n) => { for(let i=0;i<n;i++) tone(1800 + Math.random()*2600, at + i*.07, .14, "sine", .07); };   // twinkles
    const whoosh = at => { const s = noise(.6), f = AC.createBiquadFilter(), g = AC.createGain(); f.type = "bandpass"; f.Q.value = 1.2;
      f.frequency.setValueAtTime(250, t0+at); f.frequency.exponentialRampToValueAtTime(3500, t0+at+.45);
      g.gain.setValueAtTime(.0001, t0+at); g.gain.exponentialRampToValueAtTime(.6, t0+at+.18); g.gain.exponentialRampToValueAtTime(.0001, t0+at+.55);
      s.connect(f); f.connect(g); g.connect(out); s.start(t0+at); s.stop(t0+at+.6); };
    const applause = (at, secs) => { const s = noise(secs), f = AC.createBiquadFilter(), g = AC.createGain(); f.type = "bandpass"; f.frequency.value = 2600; f.Q.value = .7;
      g.gain.setValueAtTime(.0001, t0+at);
      for(let t=0; t<secs; t+=.06) g.gain.linearRampToValueAtTime((.08 + Math.random()*.22) * (1 - t/secs), t0+at+t);
      s.connect(f); f.connect(g); g.connect(out); s.start(t0+at); s.stop(t0+at+secs); };
    if(kind === "good"){                         // happy "ding ding ding-ding!" going up
      [523, 659, 784, 1047].forEach((f,i) => { tone(f, i*.09, .35, "triangle", .28); tone(f*2, i*.09, .25, "sine", .08); });
      sparkle(.3, 6);
    } else if(kind === "win"){                   // big celebration
      whoosh(0);
      [[523,0],[523,.14],[523,.28],[659,.42],[784,.62],[659,.82],[784,.96],[1047,1.16]].forEach(([f,at]) => { tone(f, at, .38, "triangle", .3); tone(f*2, at, .3, "sine", .08); });
      [1047,1319,1568].forEach(f => tone(f, 1.16, 1.0, "triangle", .12));   // final shiny chord
      sparkle(.5, 14); applause(.2, 1.8);
    } else {                                     // soft wrong "bonk"
      const o = AC.createOscillator(), g = AC.createGain(); o.type = "triangle";
      o.frequency.setValueAtTime(240, t0); o.frequency.exponentialRampToValueAtTime(110, t0+.3);
      g.gain.setValueAtTime(.4, t0); g.gain.exponentialRampToValueAtTime(.0001, t0+.35);
      o.connect(g); g.connect(out); o.start(t0); o.stop(t0+.4);
    }
  }catch(e){}
}
let voices = [];
if("speechSynthesis" in window){ voices = speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => { voices = speechSynthesis.getVoices(); }; }
function bestVoice(){                            // pick the clearest, most natural English voice on this device
  const score = v => { const n = v.name; let k = 0;
    if(/en[-_]US/i.test(v.lang)) k += 3; else if(/en[-_](GB|AU|CA)/i.test(v.lang)) k += 1;
    if(/natural|neural|online/i.test(n)) k += 6;
    if(/Google US English|Google UK English Female/i.test(n)) k += 5;
    if(/Samantha|Ava|Allison|Aria|Jenny|Joanna|Karen|Zira|Siri|Nicky|Susan/i.test(n)) k += 4;
    if(/female|woman/i.test(n)) k += 1;
    if(/Fred|Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Deranged|Good News|Hysterical|Junior|Organ|Pipe|Trinoids|Whisper|Zarvox|Eddy|Flo|Grandma|Grandpa|Reed|Rocko|Sandy|Shelley/i.test(n)) k -= 8;   // novelty voices
    return k; };
  return voices.filter(v => /^en[-_]/i.test(v.lang)).sort((a, b) => score(b) - score(a))[0] || null;
}
function speak(text){
  if(!("speechSynthesis" in window)){ toast("This browser cannot speak. Try Chrome, Edge or Safari."); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US"; u.rate = +S.rate || .65; u.pitch = 1.05; u.volume = 1;      // slow and a little brighter, for children learning English
  const v = bestVoice(); if(v){ u.voice = v; u.lang = v.lang; }
  speechSynthesis.speak(u);
}
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const e = ["🎉","⭐","🎈","🌟","🍭","🦄"];
  for(let i=0;i<20;i++){ const d = document.createElement("div"); d.className = "pop"; d.textContent = e[i%e.length];
    d.style.left = Math.random()*95 + "vw"; d.style.animationDelay = Math.random()*.5 + "s"; document.body.appendChild(d); setTimeout(() => d.remove(), 2400); }
}

/* ---------- which letters to hide ---------- */
function pickBlanks(word, mode){
  const idx = [...word].map((c,i) => /\p{L}/u.test(c) ? i : -1).filter(i => i >= 0), n = idx.length;
  if(!n) return new Set();
  let k = mode === "auto" ? Math.round(n*.4) : mode === "random" ? 1 + Math.floor(Math.random()*Math.max(1, Math.floor(n/2))) : parseInt(mode, 10);
  k = Math.min(Math.max(k,1), Math.max(1, n-1));            // always leave one letter visible
  return new Set(shuffle(idx).slice(0, k));
}

/* ===================== THE QUIZ ===================== */
let Q = null, cur = null;                       // Q = whole quiz, cur = current question

function showStart(){
  Q = null; cur = null;
  if(!words.length){ app.innerHTML = `<div class="hero">📝</div><h1>No words yet</h1><p>Press ⚙️ and add your first word.</p>`; return; }
  if(!active().length){ app.innerHTML = `<div class="hero">☑️</div><h1>No words ticked</h1><p>Press ⚙️ and tick the words you want in the quiz.</p>`; return; }
  const n = S.count === "all" ? active().length : Math.min(+S.count, active().length);
  app.innerHTML = `<div class="hero">🔤🎈</div><h1>Missing Letters Quiz</h1>
    <p>Fill in the missing letters.<br><span class="pill">${n} questions</span></p>
    <button id="go" class="big b-pink">▶ Start quiz</button>`;
  $("go").onclick = () => startQuiz(); $("go").focus();
}

function startQuiz(only){
  const pool = shuffle((only || active()).slice());
  const n = only ? pool.length : S.count === "all" ? pool.length : Math.min(+S.count, pool.length);
  Q = {list: pool.slice(0, n), i: 0, score: 0, mistakes: []};
  showQ();
}

function showQ(){
  const w = Q.list[Q.i], blanks = pickBlanks(w.en, S.mode);
  cur = {w, slots: [], hints: 0, last: null, done: false};
  app.innerHTML = `
    <div class="top"><span>Question <b>${Q.i+1}/${Q.list.length}</b></span><span>Score <b id="sc">${fmt(Q.score)}</b></span></div>
    <div class="bar"><i style="width:${Q.i / Q.list.length * 100}%"></i></div>
    <div class="pic" id="pic"></div><div class="meaning ar" id="mean"></div>
    <div class="word" id="word"></div><div class="fb" id="fb" aria-live="polite"></div><div class="bank" id="bank"></div>
    <div class="row">${S.listen ? '<button id="say" class="b-orange">🔊 Listen</button>' : ""}${S.hint ? '<button id="hint" class="b-purple">💡 Hint</button>' : ""}<button id="chk">Check ✅</button></div>`;
  const pic = $("pic"); pic.classList.add("has");           // the picture box is always 200 x 150
  if(w.img){
    pic.textContent = "⏳";
    loadPic(w.img, im => {
      if(!pic.isConnected || cur.w !== w) return;
      if(im){ pic.textContent = ""; pic.appendChild(im); } else { pic.style.fontSize = "1rem"; pic.textContent = "Picture could not be loaded"; }
    });
  } else { pic.style.fontSize = "1rem"; pic.textContent = "No picture yet"; }
  const m = $("mean");
  if(!w.ar) translate(w.en).then(t => { if(t){ w.ar = t; saveWords(); if(cur && cur.w === w && m.firstChild && m.firstChild.nodeType === 3) m.textContent = t; } });
  if(S.showAr || !w.ar){ m.textContent = w.ar || "🤔"; }
  else { const b = document.createElement("button"); b.textContent = "👁️ Show meaning"; b.className = "b-blue"; b.onclick = () => m.textContent = w.ar; m.appendChild(b); }
  const box = $("word");
  [...w.en].forEach((c,i) => {
    if(c === " "){ const g = document.createElement("div"); g.className = "gap"; box.appendChild(g); return; }
    if(!blanks.has(i)){ const d = document.createElement("div"); d.className = "ch"; d.textContent = c; box.appendChild(d); return; }
    const inp = document.createElement("input");
    inp.className = "slot"; inp.maxLength = 1; inp.autocomplete = "off"; inp.setAttribute("autocapitalize","off");
    inp.setAttribute("aria-label","Missing letter"); inp.dataset.a = c.toLowerCase(); inp.dataset.i = i;
    inp.onfocus = () => cur.last = inp;
    inp.oninput = () => { inp.value = inp.value.slice(-1); if(inp.value) move(inp, 1); };
    inp.onkeydown = e => {
      if(e.key === "Enter"){ e.preventDefault(); cur.done ? next() : check(); }
      else if(e.key === "Backspace" && !inp.value) move(inp, -1);
      else if(e.key === "ArrowLeft") move(inp, -1); else if(e.key === "ArrowRight") move(inp, 1);
    };
    if(S.choices !== "off") inp.inputMode = "none";                       // tablets: no keyboard pop-up, tap the letters instead
    inp.onclick = () => { if(S.choices !== "off" && !cur.done && !inp.readOnly) inp.value = ""; };   // tap a filled box to empty it
    box.appendChild(inp); cur.slots.push(inp);
  });
  if(S.choices !== "off"){                       // letter choices: the right letters + extra wrong ones
    const need = [...new Set(cur.slots.map(x => x.dataset.a))];
    const extra = shuffle("abcdefghijklmnopqrstuvwxyz".split("").filter(c => !need.includes(c))).slice(0, +S.choices);
    shuffle(need.concat(extra)).forEach(ch => {
      const b = document.createElement("button"); b.type = "button"; b.textContent = ch; b.setAttribute("aria-label", "Letter " + ch);
      b.onmousedown = e => e.preventDefault();   // keep the cursor in the box
      b.onclick = () => put(ch); $("bank").appendChild(b);
    });
  }
  if($("say")) $("say").onclick = () => speak(w.en);
  if($("hint")) $("hint").onclick = hint;
  $("chk").onclick = () => cur.done ? next() : check();
  if(cur.slots[0]) cur.slots[0].focus();
}
function put(ch){                               // a tapped letter goes into the box you are on, or the first empty one
  if(cur.done) return;
  const ok = s => s && !s.readOnly;
  let t = ok(cur.last) && !cur.last.value ? cur.last : cur.slots.find(s => !s.value);
  if(!t) t = ok(cur.last) ? cur.last : cur.slots.find(s => !s.readOnly);
  if(!t) return;
  t.value = ch;
  const n = cur.slots.find(s => !s.value); if(n) n.focus(); else $("chk").focus();
}
function move(from, dir){ const s = cur.slots, j = s.indexOf(from) + dir; if(s[j]) s[j].focus(); }
function setFb(t, cls){ const f = $("fb"); f.className = "fb " + (cls || ""); f.textContent = t; }

/* 💡 Hint: fills the letter you are waiting on (the box you are in, or the first empty box) */
function hint(){
  if(cur.done) return;
  const wrongOrEmpty = s => s.value.toLowerCase() !== s.dataset.a;
  let t = cur.last && !cur.last.readOnly && wrongOrEmpty(cur.last) ? cur.last : cur.slots.find(s => !s.value);
  if(!t) t = cur.slots.find(s => !s.readOnly && wrongOrEmpty(s));
  if(!t){ setFb("All letters are right so far. Press Check! ✅"); return; }
  t.value = t.dataset.a; t.readOnly = true; t.classList.add("hint"); cur.hints++;
  setFb("💡 Hint used: this word will give half a point.");
  const nxt = cur.slots.find(s => !s.value); if(nxt) nxt.focus(); else $("chk").focus();
}

function check(){
  if(cur.slots.some(s => !s.value)){ setFb("Fill in every blank first! ✍️", "no"); return; }
  const w = cur.w, bad = [];
  cur.slots.forEach(s => { if(s.value.toLowerCase() !== s.dataset.a) bad.push(s); });
  const typed = [...w.en].map((c,i) => { const s = cur.slots.find(x => +x.dataset.i === i); return s ? s.value.toLowerCase() : c; }).join("");
  cur.done = true; document.querySelectorAll("#bank button").forEach(b => b.disabled = true);
  if(!bad.length){
    const pts = cur.hints ? .5 : 1; Q.score += pts;
    cur.slots.forEach(s => { s.classList.add("ok"); s.readOnly = true; });
    sfx("good"); confetti();
    setFb(cur.hints ? "Correct! 🎉 (+½ point, you used a hint)" : "Great job! 🎉⭐ +1", "ok");
  } else {
    Q.mistakes.push({w, typed});
    const lines = bad.map(s => `“${s.value}” should be “${s.dataset.a}”`);
    bad.forEach(s => { s.classList.remove("hint"); s.classList.add("no"); s.value = s.dataset.a; });   // show the right letter
    cur.slots.forEach(s => { if(!bad.includes(s)) s.classList.add("ok"); s.readOnly = true; });
    sfx("bad"); setFb("Oops! The word is “" + w.en + "”. " + lines.join(" · "), "no");
  }
  $("sc").textContent = fmt(Q.score);
  if(S.autoSay) speak(w.en);
  const last = Q.i === Q.list.length - 1, b = $("chk");
  b.textContent = last ? "See my score 🏆" : "Next ➡️"; b.focus();
}
function next(){ Q.i++; Q.i >= Q.list.length ? showResults() : showQ(); }

function showResults(){
  const total = Q.list.length, p = Q.score / total;
  const icon = p >= .9 ? "🏆" : p >= .6 ? "🌟" : p >= .3 ? "👍" : "💪";
  const msg = p >= .9 ? "Amazing! You are a word champion!" : p >= .6 ? "Great work! Keep going!" : p >= .3 ? "Good try! Practice makes perfect." : "Don't give up! Try again, you can do it!";
  const diff = (typed, right) => [...typed].map((c,i) => c === right[i] ? esc(c) : `<u>${esc(c)}</u>`).join("");
  app.innerHTML = `<div class="hero">${icon}</div><h1>Quiz finished!</h1>
    <div class="score">${fmt(Q.score)} / ${total}</div><p>${msg}</p>` +
    (Q.mistakes.length ? `<div class="card" style="text-align:left"><h2>Let's learn from these</h2><ul class="mist">` +
      Q.mistakes.map(m => `<li><span>${diff(m.typed, m.w.en)}</span> → <b class="good">${esc(m.w.en)}</b></li>`).join("") + `</ul></div>` : `<p>No mistakes! 🎉</p>`) +
    `<div class="row"><button id="again" class="b-pink">🔄 Play again</button>` +
    (Q.mistakes.length ? `<button id="fix" class="b-orange">🎯 Practice mistakes</button>` : "") + `</div>`;
  const wrong = Q.mistakes.map(m => m.w);
  $("again").onclick = () => startQuiz(); if($("fix")) $("fix").onclick = () => startQuiz(wrong);
  if(p >= .6){ sfx("win"); confetti(); }
}

/* ===================== PICTURES FROM ANY WEBSITE =====================
   Paste a picture link (or add / paste a photo). The app tries the link directly, then free image
   helpers, and as a last resort shows the link itself in a frame, so almost any link displays. */
let picData = "", picJob = null;
const cleanLink = t => { t = (t || "").trim(); try{ const g = new URL(t).searchParams.get("imgurl"); if(g) return g; }catch(e){} return t; };  // understands Google "imgurl=" links
const isPicSrc = t => /^(https?:\/\/|data:image\/)/i.test(t);
function tryLoad(url, cors, ref = "no-referrer"){
  return new Promise(res => {
    const im = new Image(); let done = false; const end = v => { if(!done){ done = true; res(v); } };
    if(cors) im.crossOrigin = "anonymous"; if(ref) im.referrerPolicy = ref;
    im.onload = () => end(im); im.onerror = () => end(null); setTimeout(() => end(null), 12000); im.src = url;
  });
}
const viaHelpers = u => { const e = encodeURIComponent(u); return [u, "https://wsrv.nl/?url=" + e + "&w=800", "https://images.weserv.nl/?url=" + e + "&w=800", "https://external-content.duckduckgo.com/iu/?u=" + e]; };
function frameFor(url){
  const f = document.createElement("iframe"); f.src = url; f.setAttribute("sandbox", ""); f.referrerPolicy = "no-referrer"; f.title = "picture"; return f;
}
function smallJpeg(im){                          // copy into a small JPEG (max 480 px) kept inside the app
  const w = im.naturalWidth || im.width, h = im.naturalHeight || im.height, k = Math.min(1, 480 / Math.max(w, h));
  const c = document.createElement("canvas"); c.width = Math.max(1, Math.round(w*k)); c.height = Math.max(1, Math.round(h*k));
  const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", .82);
}
async function fromLink(link){                   // -> {src, im, frame?} or null
  link = cleanLink(link); if(!isPicSrc(link)) return null;
  if(/^data:/i.test(link)){ const im = await tryLoad(link, false); return im ? {src: link, im} : null; }
  const ways = viaHelpers(link);
  for(const u of ways){ const im = await tryLoad(u, true); if(im){ try{ return {src: smallJpeg(im), im}; }catch(e){} } }   // 1) copy it into the app
  for(const u of ways){ const im = await tryLoad(u, false) || await tryLoad(u, false, ""); if(im) return {src: link, im}; }     // 2) keep the link
  return {src: link, im: frameFor(link), frame: true};                                                                            // 3) force it in a frame
}
async function fromFile(f){
  if(!f || !f.type.startsWith("image/")) return null;
  const u = URL.createObjectURL(f), im = await tryLoad(u, false); if(!im){ URL.revokeObjectURL(u); return null; }
  try{ const src = smallJpeg(im); URL.revokeObjectURL(u); return {src, im: await tryLoad(src, false) || im}; }catch(e){ URL.revokeObjectURL(u); return null; }
}
function loadPic(src, cb){                       // for the quiz: show a saved picture, whatever it takes
  (async () => {
    if(/^https?:/i.test(src)){
      for(const u of viaHelpers(src)){ const im = await tryLoad(u, false) || await tryLoad(u, false, ""); if(im){ cb(im); return; } }
      cb(frameFor(src)); return;
    }
    cb(await tryLoad(src, false));
  })();
}
function setPreview(r, msg){
  const box = $("imgPrev"); box.textContent = "";
  if(r){ box.append(r.im.cloneNode(), r.frame ? "⚠️ Showing the link directly. If it stays empty, use 📷 Photo or Ctrl+V." : "✅ Picture ready"); }
  else box.textContent = msg || "You can also copy a picture and press Ctrl+V in the link box.";
}
function startJob(fn, empty){
  const job = picJob = (async () => {
    setPreview(null, "⏳ Loading the picture…"); picData = "";
    const r = await fn(); if(job !== picJob) return;
    if(r){ picData = r.src; setPreview(r); } else setPreview(null, empty);
  })();
}
let linkTimer;
$("img").oninput = () => {
  clearTimeout(linkTimer); picData = ""; const v = cleanLink($("img").value);
  if(!v){ picJob = null; setPreview(null); return; }
  if(!isPicSrc(v)){ picJob = null; setPreview(null, "Paste a full link that starts with https://"); return; }
  linkTimer = setTimeout(() => startJob(() => fromLink(v), "❌ Could not load this link. Use 📷 Photo, or copy the picture and press Ctrl+V here."), 500);
};
$("img").onpaste = e => {
  const f = [...(e.clipboardData ? e.clipboardData.files : [])].find(x => x.type.startsWith("image/"));
  if(f){ e.preventDefault(); $("img").value = ""; startJob(() => fromFile(f), "❌ That is not a picture."); }
};
$("file").onchange = e => { const f = e.target.files[0]; if(f){ $("img").value = ""; startJob(() => fromFile(f), "❌ That is not a picture."); } };

/* fill the Arabic by itself while you type the English word (never overwrites what you typed) */
let autoAr = "", typeTimer;
async function autoFill(){
  const en = $("en").value.trim(); if(!en) return;
  if(!$("ar").value || $("ar").value === autoAr){
    const t = await translate(en);
    if($("en").value.trim() === en && t && (!$("ar").value || $("ar").value === autoAr)){ $("ar").value = autoAr = t; setStatus("Arabic filled in. You can change it."); }
  }
}
$("en").oninput = () => { clearTimeout(typeTimer); typeTimer = setTimeout(autoFill, 600); };
$("en").onblur = autoFill;
$("en").onkeydown = e => { if(e.key === "Enter"){ e.preventDefault(); $("addBtn").click(); } };   // Enter adds the word

for(const id of ["ar","img"]) $(id).addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); $("addBtn").click(); } });
let editIdx = null, picRemoved = false;
function setEdit(i){                             // switch the form between "add" and "edit"
  editIdx = i; picRemoved = false;
  $("formTitle").textContent = i === null ? "✏️ Add a word" : "✏️ Edit word";
  $("addBtn").textContent = i === null ? "Add word" : "💾 Save changes";
  $("cancelEdit").hidden = i === null; $("rmPic").hidden = !(i !== null && words[i] && words[i].img);
}
function clearForm(){ $("en").value = $("ar").value = $("img").value = ""; $("file").value = ""; picData = ""; picJob = null; setPreview(null); autoAr = ""; }
function startEdit(i){
  const w = words[i]; clearForm(); setEdit(i);
  $("en").value = w.en; $("ar").value = w.ar || "";
  $("img").value = w.img && !/^data:/i.test(w.img) ? w.img : "";
  if(w.img){ picData = w.img; startJob(() => fromLink(w.img), "❌ Could not load the saved picture. Add a new one, or remove it."); }
  $("settings").scrollTo({top: 0, behavior: "smooth"}); $("en").focus();
  setStatus("Change anything you like, then press “Save changes”.");
}
$("cancelEdit").onclick = () => { clearForm(); setEdit(null); setStatus("Edit cancelled."); };
$("rmPic").onclick = () => { picData = ""; picRemoved = true; picJob = null; $("img").value = ""; $("file").value = ""; setPreview(null, "The picture will be removed when you save."); $("rmPic").hidden = true; };

$("addBtn").onclick = async () => {
  const en = $("en").value.trim(); if(!en){ toast("Please type the English word."); return; }
  let ar = $("ar").value.trim();
  if(picJob) await picJob;                       // wait until the picture has finished loading
  const typed = cleanLink($("img").value), img = picData || (isPicSrc(typed) ? typed : "");
  if(!ar){ setStatus("Translating…"); ar = await translate(en); }       // empty Arabic = automatic translation
  const wasEdit = editIdx !== null, i = wasEdit ? editIdx : words.findIndex(w => w.en.toLowerCase() === en.toLowerCase()), rec = {en, ar: ar || (i>=0 ? words[i].ar : ""), img: img || (i>=0 && !picRemoved ? words[i].img || "" : ""), on: i>=0 ? words[i].on !== false : true};
  if(i >= 0) words[i] = rec; else words.push(rec);
  saveWords(); renderList(); setEdit(null);
  $("en").value = $("ar").value = $("img").value = ""; $("file").value = ""; picData = ""; picJob = null; setPreview(null); autoAr = ""; $("en").focus();
  setStatus(!ar ? "Added, but translation failed. " + trWhy + "Type the Arabic yourself, or press “Translate missing” later." : (wasEdit ? "Saved: " : "Added: ") + en + " = " + rec.ar + (rec.img ? " 🖼️ ✔" : " ✔ (no picture yet: paste a link or add a photo)"));
  Q = null;
};

function renderList(){
  $("count2").textContent = "(" + active().length + " of " + words.length + " ticked)";
  const ul = $("list"); ul.innerHTML = "";
  words.forEach((w,i) => {
    const li = document.createElement("li");
    li.innerHTML = `<input type="checkbox" class="sel" aria-label="Include in quiz"><span class="e"></span><div class="t"><b></b><span class="ar"></span></div><button class="b-orange edt" aria-label="Edit">✏️</button><button class="b-blue spk" aria-label="Listen">🔊</button><button class="b-red del" aria-label="Delete">✕</button>`;
    if(w.img){ const im = new Image(); im.referrerPolicy = "no-referrer"; im.src = w.img; im.alt = ""; li.querySelector(".e").appendChild(im); }
    const cb = li.querySelector(".sel"); cb.checked = w.on !== false;
    cb.onchange = () => { w.on = cb.checked; saveWords(); $("count2").textContent = "(" + active().length + " of " + words.length + " ticked)"; Q = null; };
    li.querySelector("b").textContent = w.en;
    li.querySelector(".ar").textContent = w.ar || "(no Arabic yet)";
    li.querySelector(".edt").onclick = () => startEdit(i);
    li.querySelector(".spk").onclick = () => speak(w.en);
    li.querySelector(".del").onclick = () => { words.splice(i,1); saveWords(); renderList(); Q = null; if(editIdx !== null){ clearForm(); setEdit(null); } };
    ul.appendChild(li);
  });
}
$("selAll").onclick = () => { words.forEach(w => w.on = true); saveWords(); renderList(); Q = null; };
$("selNone").onclick = () => { words.forEach(w => w.on = false); saveWords(); renderList(); Q = null; };
$("fixBtn").onclick = async () => {
  const todo = words.filter(w => !w.ar);
  if(!todo.length){ toast("Every word already has an Arabic meaning ✔"); return; }
  for(const w of todo){ if(!w.ar) w.ar = await translate(w.en); }
  saveWords(); renderList(); toast(words.some(w => !w.ar) ? "Could not translate some words. " + trWhy : "Done ✔");
};
let resetTimer;
$("resetBtn").onclick = () => {
  const b = $("resetBtn");
  if(b.dataset.sure){ clearTimeout(resetTimer); delete b.dataset.sure; b.textContent = "↺ Default words"; words = SEED.map(w => ({...w})); saveWords(); clearForm(); setEdit(null); renderList(); Q = null; toast("Default words restored."); }
  else { b.dataset.sure = "1"; b.textContent = "Tap again to restore"; resetTimer = setTimeout(() => { delete b.dataset.sure; b.textContent = "↺ Default words"; }, 4000); }
};
let clearTimer;
$("clearBtn").onclick = () => {                  // two taps, because pop-up questions are blocked in some viewers
  const b = $("clearBtn");
  if(b.dataset.sure){ clearTimeout(clearTimer); delete b.dataset.sure; b.textContent = "Delete all"; words = []; saveWords(); renderList(); Q = null; toast("All words deleted."); }
  else { b.dataset.sure = "1"; b.textContent = "Tap again to confirm"; clearTimer = setTimeout(() => { delete b.dataset.sure; b.textContent = "Delete all"; }, 4000); }
};

/* quiz settings */
document.documentElement.style.setProperty("--fit", S.fit);
$("fit").value = S.fit;
$("fit").onchange = () => { S.fit = $("fit").value; document.documentElement.style.setProperty("--fit", S.fit); saveSet(); };
$("choices").value = S.choices;
$("choices").onchange = () => { S.choices = $("choices").value; saveSet(); };
$("mode").value = S.mode; $("count").value = S.count; $("showAr").checked = S.showAr; $("autoSay").checked = S.autoSay;
$("tListen").checked = S.listen; $("tHint").checked = S.hint; $("rate").value = S.rate; $("wcolor").value = S.wcolor;
document.documentElement.style.setProperty("--word", S.wcolor);
$("tListen").onchange = () => { S.listen = $("tListen").checked; saveSet(); };
$("tHint").onchange = () => { S.hint = $("tHint").checked; saveSet(); };
$("rate").onchange = () => { S.rate = $("rate").value; saveSet(); speak("elephant"); };           // plays a sample
$("wcolor").oninput = () => { S.wcolor = $("wcolor").value; document.documentElement.style.setProperty("--word", S.wcolor); saveSet(); };
$("mode").onchange = () => { S.mode = $("mode").value; saveSet(); };
$("count").onchange = () => { S.count = $("count").value; saveSet(); };
$("showAr").onchange = () => { S.showAr = $("showAr").checked; saveSet(); };
$("autoSay").onchange = () => { S.autoSay = $("autoSay").checked; saveSet(); };

/* start, then quietly fill in anything missing (Arabic) */
showStart();
(async () => {
  let changed = false;
  for(const w of words){
    if(!w.ar){ const t = await translate(w.en); if(t){ w.ar = t; changed = true; } }
  }
  if(changed) saveWords();
})();
</script>
</body>
</html>
